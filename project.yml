# xcodegen: the Xcode project is made from this file (xcodegen generate).
name: EQStudio
options:
  bundleIdPrefix: me.suryajs
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  EQCore:
    path: Packages/EQCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
targets:
  EQStudio:
    type: application
    supportedDestinations: [iOS]
    sources:
      - path: App
        excludes: ["AppIcon.icon"]
      - path: App/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: EQCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.suryajs.eqstudio
        PRODUCT_NAME: EQ Studio
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: EQ Studio
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_NSCameraUsageDescription: EQ Studio reads the QR code your Q2 shows to sign in.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: EQ Studio talks to the EQ Studio app on your Q2 over your Wi-Fi.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown
    info:
      path: App/Info.plist
      properties:
        NSAppTransportSecurity:
          # EQ Studio serves plain HTTP on the Q2's own address: on the Wi-Fi, or a Tailscale 100.x one.
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        UIRequiredDeviceCapabilities: []
