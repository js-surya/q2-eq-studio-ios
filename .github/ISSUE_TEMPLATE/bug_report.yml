name: Bug report
description: Something in the app doesn't work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please don't paste your Q2's address, PIN or the link from its QR code.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Tap …
        3. See …
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Device
      options: [iPhone, iPad]
      multiple: true
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: The app's version (Settings → About), iOS version, and EQ Studio and Q2 Pod versions
      placeholder: 0.1.0 (1), iOS 26.1, EQ Studio 1.3.0, Q2 Pod 1.9.0
  - type: textarea
    id: logs
    attributes:
      label: Screenshots
      description: Optional. Remove anything private first.
